apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: district-badges-prod

namePrefix: prod-

resources:
  - ../../base

replicas:
  - name: district-badges
    count: 2
  - name: badge-import-worker
    count: 1

labels:
  - pairs:
      environment: production
    includeSelectors: true
    includeTemplates: true

patches:
  - target:
      kind: Namespace
      name: district-badges
    patch: |-
      - op: replace
        path: /metadata/name
        value: district-badges-prod
  - path: config-map-patch.yaml
  - path: nginx-config-map-patch.yaml
  - path: certificate-patch.yaml
  - path: one-password-item-patch.yaml
