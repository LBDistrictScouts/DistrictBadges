apiVersion: apps/v1
kind: Deployment
metadata:
  name: district-badges
  namespace: district-badges
spec:
  replicas: 2
  selector:
    matchLabels:
      app: district-badges
  template:
    metadata:
      labels:
        app: district-badges
    spec:
      serviceAccountName: district-badges-runtime
      initContainers:
        - name: copy-app-code
          image: ghcr.io/lbdistrictscouts/districtbadges/backend:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - cp -a /var/www/html/. /workdir
          volumeMounts:
            - name: app-code
              mountPath: /workdir
      containers:
        - name: app
          image: ghcr.io/lbdistrictscouts/districtbadges/backend:latest
          imagePullPolicy: Always
          command:
            - php-fpm
            - -F
          envFrom:
            - configMapRef:
                name: district-badges-config
            - secretRef:
                name: district-badges-secrets
          ports:
            - containerPort: 9000
              name: fpm
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: app-code
              mountPath: /var/www/html
        - name: web
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          readinessProbe:
            httpGet:
              path: /healthz
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: app-code
              mountPath: /var/www/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: district-badges-tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: app-code
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: district-badges-nginx
        - name: district-badges-tls
          secret:
            secretName: district-badges-tls
