apiVersion: apps/v1
kind: Deployment
metadata:
  name: badge-import-worker
  namespace: district-badges
spec:
  replicas: 1
  selector:
    matchLabels:
      app: badge-import-worker
  template:
    metadata:
      labels:
        app: badge-import-worker
    spec:
      serviceAccountName: district-badges-runtime
      containers:
        - name: worker
          image: ghcr.io/lbdistrictscouts/districtbadges-backend:latest
          imagePullPolicy: Always
          command:
            - php
            - bin/cake.php
            - badges:consume_import_queue
          envFrom:
            - configMapRef:
                name: district-badges-config
            - secretRef:
                name: district-badges-secrets
          livenessProbe:
            exec:
              command:
                - php
                - -r
                - 'exit(is_file("/tmp/district-badges-worker/heartbeat") && filemtime("/tmp/district-badges-worker/heartbeat") >= time() - 300 ? 0 : 1);'
            initialDelaySeconds: 180
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: district-badges
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-worker
  template:
    metadata:
      labels:
        app: order-worker
    spec:
      serviceAccountName: district-badges-runtime
      containers:
        - name: worker
          image: ghcr.io/lbdistrictscouts/districtbadges-backend:latest
          imagePullPolicy: Always
          command:
            - php
            - bin/cake.php
            - orders:consume_queue
          envFrom:
            - configMapRef:
                name: district-badges-config
            - secretRef:
                name: district-badges-secrets
          livenessProbe:
            exec:
              command:
                - php
                - -r
                - 'exit(is_file("/tmp/district-badges-worker/heartbeat") && filemtime("/tmp/district-badges-worker/heartbeat") >= time() - 120 ? 0 : 1);'
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
