name: Frontend Tests and Deploy

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'webstore/**'
      - '.github/workflows/frontend-tests.yml'
  schedule:
    - cron: '0 5 * * 0'
  pull_request:
    branches:
      - '*'
    paths:
      - 'webstore/**'
      - '.github/workflows/frontend-tests.yml'
  workflow_dispatch:
    inputs:
      release_environment:
        description: GitHub Environment to deploy to
        required: true
        default: test
        type: choice
        options:
          - test
          - production

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend-tests:
    name: Webstore Tests
    # Pull requests can contain untrusted code, so validation must not use a self-hosted runner.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webstore

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn tsc -b

  deploy:
    name: Deploy Webstore
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: frontend-tests
    runs-on: lbdistrictscouts-runners
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.release_environment || (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev') && 'test' || 'production' }}
    concurrency:
      group: webstore-${{ github.event_name == 'workflow_dispatch' && inputs.release_environment || (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev') && 'test' || 'production' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: webstore

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn install --immutable

      - name: Build webstore
        env:
          VITE_ALGOLIA_APP_ID: ${{ vars.VITE_ALGOLIA_APP_ID }}
          VITE_ALGOLIA_SEARCH_API_KEY: ${{ secrets.VITE_ALGOLIA_SEARCH_API_KEY }}
          VITE_ALGOLIA_BADGES_INDEX: ${{ vars.VITE_ALGOLIA_BADGES_INDEX }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          CATALOGUE_API_URL: ${{ vars.CATALOGUE_API_URL }}
          CATALOGUE_BASIC_AUTH_USERNAME: ${{ secrets.CATALOGUE_BASIC_AUTH_USERNAME }}
          CATALOGUE_BASIC_AUTH_PASSWORD: ${{ secrets.CATALOGUE_BASIC_AUTH_PASSWORD }}
        run: yarn build

      - name: Install AWS CLI
        working-directory: ${{ runner.temp }}
        run: |
          case "$(uname -m)" in
            x86_64) aws_arch=x86_64 ;;
            aarch64|arm64) aws_arch=aarch64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --location \
            "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" \
            --output awscliv2.zip
          unzip -q awscliv2.zip
          ./aws/install \
            --install-dir "${RUNNER_TEMP}/aws-cli" \
            --bin-dir "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate deployment configuration
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$S3_BUCKET"
          test -n "$CLOUDFRONT_DISTRIBUTION_ID"

      - name: Publish to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: aws s3 sync dist/ "s3://$S3_BUCKET/" --delete --only-show-errors

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*'
