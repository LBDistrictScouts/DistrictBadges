name: Backend Tests

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-assets:
    name: Frontend Assets
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: backend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Yarn install
        run: yarn install --immutable

      - name: Build frontend assets
        run: yarn build

      - name: Check generated assets
        run: test -z "$(git status --porcelain -- webroot/css webroot/js)"

  backend-tests:
    name: Backend Tests (${{ matrix.database }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: SQLite
            database_test_url: sqlite://./testdb.sqlite
          - database: PostgreSQL
            database_test_url: postgres://postgres:postgres@127.0.0.1:5432/district_badges_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: district_badges_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d district_badges_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, pdo_sqlite
          coverage: none

      - name: Composer install
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer post install
        working-directory: backend
        run: composer run-script post-install-cmd --no-interaction

      - name: CS check
        working-directory: backend
        run: composer cs-check

      - name: Run tests
        working-directory: backend
        run: composer test
        env:
          DATABASE_TEST_URL: ${{ matrix.database_test_url }}
